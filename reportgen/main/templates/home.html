{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,500;0,600;0,700;0,800;0,900;1,100;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Document</title>
</head>
<body>
    <section class="main">
        <div class="left">
            <div class="content">
                <h1>Report Generation</h1>
                <form action="{% url 'get_data_from_form' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-col">
                        <label for="domain">Enter your Domain :</label>
                        <input type="text" id="domain" name="domain">
                    </div>
                    <div class="form-col">
                        <label for="objectives">Enter Objectives separated by commas :</label>
                        <input type="text" id="objectives" name = "objectives">
                    </div>
                    <button class="bn632-hover bn21" type="submit">Submit</button>
                </form>
            </div>
        </div>
        <div class="right">
            <div class="img-div">
            </div>
        </div>
    </section>
    
</body>
</html>
